<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <!-- Hamburguesa a la izquierda -->
    <ion-buttons slot="start">
      <ion-menu-button color="dark"></ion-menu-button>
    </ion-buttons>
    
    <!-- Iconos y Perfil a la derecha (Topbar Web) -->
    <ion-buttons slot="end">
      <!-- Botón de notificaciones -->
      <ion-button color="dark">
        <ion-icon name="notifications-outline" slot="icon-only"></ion-icon>
        <ion-badge color="danger" style="position: absolute; top: 4px; right: 4px; font-size: 10px; border-radius: 50%;">2</ion-badge>
      </ion-button>
      
      <!-- Avatar de perfil -->
      <ion-button color="dark" class="ion-margin-end">
        <ion-avatar style="width: 32px; height: 32px; background: var(--ion-color-primary); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 14px;">
          US
        </ion-avatar>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" color="light">
  <div id="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--ion-color-medium);">
    <h2><ion-icon name="home-outline" style="font-size: 40px;"></ion-icon></h2>
    <h2>Bienvenido a Fincas</h2>
    <p>Selecciona una opción en el menú lateral o configura los Tabs.</p>
  </div>
</ion-content>
