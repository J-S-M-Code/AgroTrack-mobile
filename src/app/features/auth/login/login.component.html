<ion-content class="ion-padding ion-text-center">
  <div class="login-container">
    <div class="logo-section">
      <img src="assets/logo/agrotrack-logo.png" alt="AgroTrack Logo" class="logo" />
      <div class="badge-wrapper">
        <ion-badge color="primary">BETA</ion-badge>
      </div>
      <p class="subtitle">Gestión Agrícola Inteligente</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <ion-item *ngIf="errorMessage" color="danger" class="error-msg" lines="none">
        <ion-icon name="warning-outline" slot="start"></ion-icon>
        <ion-label class="ion-text-wrap">{{ errorMessage }}</ion-label>
      </ion-item>

      <ion-list lines="full">
        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
          <ion-input 
            type="email" 
            inputmode="email"
            autocomplete="email"
            autocapitalize="off"
            formControlName="email"
            placeholder="usuario@agrotrack.com"
            label="Correo Electrónico"
            labelPlacement="floating"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-input 
            [type]="showPassword ? 'text' : 'password'"
            autocomplete="current-password"
            formControlName="password"
            placeholder="••••••••"
            label="Contraseña"
            labelPlacement="floating"
          ></ion-input>
          <ion-button
            fill="clear"
            slot="end"
            type="button"
            class="password-toggle-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <ion-icon slot="icon-only" [name]="showPassword ? 'eye-off-outline' : 'eye-outline'" color="medium"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>

      <div class="form-actions ion-margin-top">
        <ion-button expand="block" type="submit" [disabled]="loginForm.invalid || isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent" slot="start"></ion-spinner>
          <span *ngIf="!isLoading">Ingresar</span>
          <ion-icon *ngIf="!isLoading" name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </div>

      <div class="login-footer ion-margin-top">
        <a routerLink="/forgot-password" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</ion-content>
