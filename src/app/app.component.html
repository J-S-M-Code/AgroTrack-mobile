<ion-app>
  <!-- Menú lateral (Sidebar) -->
  <ion-menu contentId="main-content" type="overlay">
    <ion-header class="ion-no-border">
      <ion-toolbar color="primary">
        <ion-title>AgroTrack <ion-badge color="warning" style="vertical-align: middle; margin-left: 5px;">BETA</ion-badge></ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false">
          <!-- Menú Principal -->
          <ion-item button routerLink="/home" routerDirection="root">
            <ion-icon slot="start" name="home-outline"></ion-icon>
            <ion-label>Fincas</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="grid-outline"></ion-icon>
            <ion-label>Lotes</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="map-outline"></ion-icon>
            <ion-label>Mapa</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="layers-outline"></ion-icon>
            <ion-label>Mapas Espectrales</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="notifications-outline"></ion-icon>
            <ion-label>Novedades</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="clipboard-outline"></ion-icon>
            <ion-label>Tareas</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="leaf-outline"></ion-icon>
            <ion-label>Cultivos</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="paw-outline"></ion-icon>
            <ion-label>Animales</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
      
      <ion-list lines="none" class="ion-margin-top">
        <ion-menu-toggle auto-hide="false">
          <!-- Bottom Menu -->
          <ion-item button>
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Configuración</ion-label>
          </ion-item>
          <ion-item button>
            <ion-icon slot="start" name="people-outline"></ion-icon>
            <ion-label>Personas</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- Contenedor principal de vistas -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
